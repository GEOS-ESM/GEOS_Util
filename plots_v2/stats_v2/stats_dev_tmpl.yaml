# stats.yaml

parameters:
  # length and dates form inclusive ranges
    fcst_length: 10 # days (whole numbers only)
    fcst_interval: 6 # hours (whole numbers only)
    fcst_spacing: 1 # days between forecasts beginning on start_date
    start_date: 20251203 # YYYYMMDD
    end_date: 20260228 # YYYYMMDD
    init_hour: 0 # single fcst initialization hour to process; e.g., 0, 6, 12, 18, etc.
    # exclude_dates: [20251206] # [comma-separated list of dates to exclude as YYYYMMDD]

  # stats options [comma-separated lists]
    levels: [1000, 975, 950, 925, 900, 850, 800, 750, 700, 600, 500, 400, 300, 250, 200, 150, 100, 70, 50, 30, 10, 7, 5, 3, 1] # pressure levels hPa
    3d_vars_default: [H, Q, T, U, V]                  # chosen from among [H, Q, T, U, V]
    2d_vars_default: [P, PS]                          # chosen from among [P, PS]
    2d_vars_slices:  [Q2m, T2m, U10m, V10m, D2m]      # chosen from among [Q2m, T2m, U10m, V10m, D2m]
    2d_vars_columns: [TQI, TQL, TQV]                  # chosen from among [TQI, TQL, TQV]
    2d_vars_clouds:  [TCC]                            # chosen from among [TCC, MUCAPE, MUCIN, CBH]
    2d_vars_aerosol: [AOD, PM25, LOGAOD]              # chosen from among [AOD, PM25, LOGAOD]
    regions: [GLO, NHE, TRO, SHE, NPO, SPO, XPO, CUS, LND, NHL, TRL, SHL] # chosen from among [GLO, NHE, TRO, SHE, NWQ, NEQ, SWQ, SEQ, NAM, EUR, NPO, SPO, XPO, CUS, LND, NHL, TRL, SHL]

    # run stats_regional (for corcmp) and/or stats_global (for syscmp)? [regional, global, both, or none]
    stats_types: both
    # optional location(s) to search for pre-existing processed fcst/ana/clim datasets [comma-separated list]
    dir_loc: # [/path/to/loc1, /path/to/loc2]

  # fcst/ana/clim directories/templates should reference initialization and valid dates/times using tags
  # time components: YYYY (year), MM (month), DD (day), HH (hour), NN (minute), SS (second)
  # these can be combined dynamically with 'init_' or 'valid_' prefixes (e.g., {init_YYYYMMDD}, {valid_HHNNSS}, {init_YYYY-MM-DD_HH})
  # time shifts can be applied in integer days (d), hours (h), minutes (m), or seconds (s) like: {init_YYYYMMDD,shift=-90m} or {valid_HH,shift=3h}
  # note: if a directory or template starts with a tag like {expid} or {init_YYYY}, wrap the path in quotes
  # templates for slices/columns/clouds/aerosols are optional; if not present or left blank will be assumed to be the same as default

    # v11 forecasts -------------------------------------------------------------------------------------------

    expid: v11p11p0_L072_C360_RFCST-FP # experiment ID (optional, expanded internally in directories/templates)

    fcst_model: V11p11p0C360L072
    fcst_input_dir: /discover/nobackup/projects/gmao/geos_itv/mefrazer/Replay_Experiments/{expid}/forecasts/Regular_RPLFRQ-21600_ANA-*_{init_YYYYMMDD_HH}z
    fcst_input_template_default: '{expid}_FCST.geosgcm_fcst.{init_YYYYMMDD}_{init_HHNN}z.nc4'
    fcst_input_template_slices:  '{expid}_FCST.inst6_2d_asm_Nx.{init_YYYYMMDD}_{init_HHNN}z.nc4'
    fcst_input_template_columns: '{expid}_FCST.geosgcm_budi.{init_YYYYMMDD}_{init_HHNN}z.nc4'
    fcst_input_template_clouds:  '{expid}_FCST.inst6_2d_asm_Nx.{init_YYYYMMDD}_{init_HHNN}z.nc4'
    fcst_input_template_aerosol: '{expid}_FCST.tavg3_2d_aer_x.{init_YYYYMMDD,shift=-90m}_{init_HHNN,shift=-90m}z.nc4'

    # v11, SELF-verified

    ana_model: V11p11p0C360L072
    ana_input_dir: /discover/nobackup/projects/gmao/geos_itv/mefrazer/Replay_Experiments/{expid}/holding
    ana_input_template_default: geosgcm_prog/{valid_YYYYMM}/{expid}.geosgcm_prog.{valid_YYYYMMDD_HHNN}z.nc4
    ana_input_template_slices:  inst3_2d_asm_Nx/{valid_YYYYMM}/{expid}.inst3_2d_asm_Nx.{valid_YYYYMMDD_HHNN}z.nc4
    ana_input_template_columns: geosgcm_budi/{valid_YYYYMM}/{expid}.geosgcm_budi.{valid_YYYYMMDD_HHNN}z.nc4
    ana_input_template_clouds:  inst3_2d_asm_Nx/{valid_YYYYMM}/{expid}.inst3_2d_asm_Nx.{valid_YYYYMMDD_HHNN}z.nc4
    ana_input_template_aerosol: tavg3_2d_aer_x/{valid_YYYYMM,shift=-90m}/{expid}.tavg3_2d_aer_x.{valid_YYYYMMDD_HHNN,shift=-90m}z.nc4

    clim_model: MERRA2
    clim_input_dir: /discover/nobackup/projects/gmao/geos_itv/mefrazer/METplus/clim/trimmed
    clim_input_template_default: MERRA-2.inst3_3d_asm_Np.198501_201412.clim_{valid_HH}z.576x361.data.nc4
    clim_input_template_slices:  MERRA-2.inst1_2d_asm_Nx.198501_201412.clim_{valid_HH}z.576x361.data.nc4
    clim_input_template_columns: MERRA-2.inst1_2d_asm_Nx.198501_201412.clim_{valid_HH}z.576x361.data.nc4
    clim_input_template_clouds:  MERRA-2.inst1_2d_asm_Nx.198501_201412.clim_{valid_HH}z.576x361.data.nc4
    clim_input_template_aerosol: geos_it_climatology_{valid_HH}z_2003_2022.nc

    # v11, FP-verified -- no columns or clouds collection

    # ana_model: GEOSFP
    # ana_input_dir: /discover/nobackup/projects/gmao/gmao_ops/pub/f5430_fp/das
    # ana_input_template_default: Y{valid_YYYY}/M{valid_MM}/D{valid_DD}/GEOS.fp.asm.inst3_3d_asm_Np.{valid_YYYYMMDD}_{valid_HHNN}.V01.nc4
    # ana_input_template_slices:  Y{valid_YYYY}/M{valid_MM}/D{valid_DD}/GEOS.fp.asm.inst3_2d_asm_Nx.{valid_YYYYMMDD}_{valid_HHNN}.V01.nc4
    # ana_input_template_aerosol: Y{valid_YYYY,shift=-90m}/M{valid_MM,shift=-90m}/D{valid_DD,shift=-90m}/GEOS.fp.asm.tavg3_2d_aer_Nx.{valid_YYYYMMDD_HHNN,shift=-90m}.V01.nc4

    # clim_model: MERRA2
    # clim_input_dir: /discover/nobackup/projects/gmao/geos_itv/mefrazer/METplus/clim/trimmed
    # clim_input_template_default: MERRA-2.inst3_3d_asm_Np.198501_201412.clim_{valid_HH}z.576x361.data.nc4
    # clim_input_template_slices:  MERRA-2.inst1_2d_asm_Nx.198501_201412.clim_{valid_HH}z.576x361.data.nc4
    # clim_input_template_aerosol: geos_it_climatology_{valid_HH}z_2003_2022.nc

    # v11, ERA5-verified -- no aerosol collection

    # ana_model: ERA5
    # ana_input_dir: /css/era5
    # ana_input_template_default: pressure_level_hourly/Y{valid_YYYY}/M{valid_MM}/era5_pl-allvar.{valid_YYYYMMDD_HH}z.nc4
    # ana_input_template_slices:  single_level_hourly/Y{valid_YYYY}/M{valid_MM}/D{valid_DD}/era5_slv_1hr_inst_{valid_YYYYMMDD}.nc4
    # ana_input_template_columns: single_level_hourly/Y{valid_YYYY}/M{valid_MM}/D{valid_DD}/era5_slv_6hr_inst_{valid_YYYYMMDD}.nc4
    # ana_input_template_clouds:  single_level_hourly/Y{valid_YYYY}/M{valid_MM}/D{valid_DD}/era5_slv_6hr_inst_{valid_YYYYMMDD}.nc4

    # clim_model: ERA5
    # clim_input_dir: /discover/nobackup/projects/gmao/geos_itv/mefrazer/METplus/clim/trimmed
    # clim_input_template_default: era5_mnth.mrg1_avg.1440x0721.Y1985-2014.T{valid_HH}z.nc4

