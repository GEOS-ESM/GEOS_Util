    # expid: GEOS.fp # experiment ID (optional, expanded internally in directories/templates)

    # fcst_model: f5430fp
    # fcst_input_dir: /discover/nobackup/projects/gmao/geos_fp_arch/f5430_fp
    # fcst_input_template_default: forecast/Y{init_YYYY}/M{init_MM}/D{init_DD}/H{init_HH}/{expid}.fcst.inst3_3d_asm_Np.{init_YYYYMMDD_HH}+{valid_YYYYMMDD_HHNN}.V01.nc4
    # fcst_input_template_slices:  prog/Y{init_YYYY,shift=-3h}/M{init_MM,shift=-3h}/D{init_DD,shift=-3h}/H{init_HH,shift=-3h}/f5430_fp.prog.sfc.{init_YYYYMMDD_HH,shift=-3h}z+{valid_YYYYMMDD_HH}z.nc4
    # fcst_input_template_columns: forecast/Y{init_YYYY}/M{init_MM}/D{init_DD}/H{init_HH}/{expid}.fcst.tavg1_2d_slv_Nx.{init_YYYYMMDD_HH}+{valid_YYYYMMDD_HHNN,shift=-30m}.V01.nc4
    # fcst_input_template_clouds:  forecast/Y{init_YYYY}/M{init_MM}/D{init_DD}/H{init_HH}/{expid}.fcst.tavg1_2d_rad_Nx.{init_YYYYMMDD_HH}+{valid_YYYYMMDD_HHNN,shift=-30m}.V01.nc4
    # fcst_input_template_aerosol: forecast/Y{init_YYYY}/M{init_MM}/D{init_DD}/H{init_HH}/{expid}.fcst.tavg3_2d_aer_Nx.{init_YYYYMMDD_HH}+{valid_YYYYMMDD_HHNN,shift=-90m}.V01.nc4

    # FP, SELF-verified

    # ana_model: f5430fp
    # ana_input_dir: /discover/nobackup/projects/gmao/gmao_ops/pub/f5430_fp/das
    # ana_input_template_default: Y{valid_YYYY}/M{valid_MM}/D{valid_DD}/{expid}.asm.inst3_3d_asm_Np.{valid_YYYYMMDD}_{valid_HHNN}.V01.nc4
    # ana_input_template_slices:  Y{valid_YYYY}/M{valid_MM}/D{valid_DD}/{expid}.asm.inst3_2d_asm_Nx.{valid_YYYYMMDD}_{valid_HHNN}.V01.nc4
    # ana_input_template_columns: Y{valid_YYYY,shift=-30m}/M{valid_MM,shift=-30m}/D{valid_DD,shift=-30m}/{expid}.asm.tavg1_2d_slv_Nx.{valid_YYYYMMDD,shift=-30m}_{valid_HHNN,shift=-30m}.V01.nc4
    # ana_input_template_clouds:  Y{valid_YYYY,shift=-30m}/M{valid_MM,shift=-30m}/D{valid_DD,shift=-30m}/{expid}.asm.tavg1_2d_rad_Nx.{valid_YYYYMMDD,shift=-30m}_{valid_HHNN,shift=-30m}.V01.nc4
    # ana_input_template_aerosol: Y{valid_YYYY,shift=-90m}/M{valid_MM,shift=-90m}/D{valid_DD,shift=-90m}/{expid}.asm.tavg3_2d_aer_Nx.{valid_YYYYMMDD_HHNN,shift=-90m}.V01.nc4

    # clim_model: MERRA2
    # clim_input_dir: /discover/nobackup/projects/gmao/geos_itv/mefrazer/METplus/clim/trimmed
    # clim_input_template_default: MERRA-2.inst3_3d_asm_Np.198501_201412.clim_{valid_HH}z.576x361.data.nc4
    # clim_input_template_slices:  MERRA-2.inst1_2d_asm_Nx.198501_201412.clim_{valid_HH}z.576x361.data.nc4
    # clim_input_template_columns: MERRA-2.inst1_2d_asm_Nx.198501_201412.clim_{valid_HH}z.576x361.data.nc4
    # clim_input_template_clouds:  MERRA-2.inst1_2d_asm_Nx.198501_201412.clim_{valid_HH}z.576x361.data.nc4
    # clim_input_template_aerosol: geos_it_climatology_{valid_HH}z_2003_2022.nc

    # FP, ERA5-verified -- no columns, clouds, or aerosol collections

    # ana_model: ERA5
    # ana_input_dir: /css/era5
    # ana_input_template_default: pressure_level_hourly/Y{valid_YYYY}/M{valid_MM}/era5_pl-allvar.{valid_YYYYMMDD_HH}z.nc4
    # ana_input_template_slices:  single_level_hourly/Y{valid_YYYY}/M{valid_MM}/D{valid_DD}/era5_slv_1hr_inst_{valid_YYYYMMDD}.nc4

    # clim_model: ERA5
    # clim_input_dir: /discover/nobackup/projects/gmao/geos_itv/mefrazer/METplus/clim/trimmed
    # clim_input_template_default: era5_mnth.mrg1_avg.1440x0721.Y1985-2014.T{valid_HH}z.nc4

  # Scorecard options (only used with stats_regional which writes the scorecard input files)
    make_scorecard_files: True # make .txt files with scorecard input? True or False
    model:  V11p11p0C360L072   # model name that will appear in the "forecast" column; used by scorecard code to query database
    verify: self               # verification source name that will apear in the "verify" column, e.g., gmao or self or ecmwf or era5; used by scorecard code to query database
    expver: gmao               # forecast model source name that will appear in the "expver" and "source" columns; not used by scorecard code

  # output grid (fcst/ana/clim will be all be re-gridded to this)
    Nlat: 91        # number of lat points
    Nlon: 144       # number of lon points
    delta_lat: 2.0  # latitude increment
    delta_lon: 2.5  # longitude increment

  # aliases (add to these case-insensitive lists if your fcst/ana/clim variables have names that aren't already listed)
    # default
    H_alias:  [h, hght, hgtprs, hgt, gh, z]
    Q_alias:  [q, qv, sphu, spfh]
    T_alias:  [t, tmpu, tmpprs, tmp]
    U_alias:  [u, uwnd, ugrdprs, ugrd]
    V_alias:  [v, vwnd, vgrdprs, vgrd]
    P_alias:  [slp, slprs, prmsl, msl]
    PS_alias: [ps, sp, pres_sfc]
    # slices
    T2m_alias:  [t2m, t2, tmp_2m]
    Q2m_alias:  [q2m, q2, qv2m, qv2, spfh_2m]
    U10m_alias: [u10m, u10, ugrd_10m]
    V10m_alias: [v10m, v10, vgrd_10m]
    D2m_alias:  [d2m, d2, dpt_2m, dwpt, td, t2mdew]
    # columns
    TQI_alias: [tqi, tciw]
    TQL_alias: [tql, tclw]
    TQV_alias: [tqv, tcwv, twv]
    # clouds
    TCC_alias:    [cldtt, cldtot, tcc]
    MUCAPE_alias: [mucape, cape]
    MUCIN_alias:  [mucin, cin]
    CBH_alias:    [cbh, cldbasehgt]
    # aerosols
    AOD_alias:       [totexttau]
    PM25_alias:      [pm25]
    SSSMASS25_alias: [sssmass25]
    DUSMASS25_alias: [dusmass25]
    BCSMASS_alias:   [bcsmass]
    OCSMASS_alias:   [ocsmass]
    SO4SMASS_alias:  [so4smass]
    NISMASS25_alias: [nismass25]
    NH4SMASS_alias:  [nh4smass]

  # SBATCH parameters (only used by stats.run, not stats.py)
    account:
    partition:
    qos:
